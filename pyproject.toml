[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tommy"
version = "0.1.0"
description = "Agent-first sales roleplay and evidence-linked coaching with Expected Parrot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
edsl = ["edsl>=1.0.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tommy = "tommy.cli:main"

[project.urls]
Homepage = "https://expectedparrot.github.io/tommy/"
Documentation = "https://expectedparrot.github.io/tommy/"
Repository = "https://github.com/expectedparrot/tommy"
Issues = "https://github.com/expectedparrot/tommy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tommy"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
